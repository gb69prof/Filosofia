<!doctype html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06151d">
  <meta name="description" content="PWA didattica completa e interattiva sulla filosofia di san Tommaso d'Aquino.">
  <title>San Tommaso d'Aquino · La ragione illuminata dalla fede</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <a class="skip-link" href="#view">Vai al contenuto</a>
  <header class="topbar">
    <a class="brand" href="#/home" aria-label="Torna alla pagina iniziale">
      <span class="brand-mark" aria-hidden="true">S.T.</span>
      <span><strong>San Tommaso d’Aquino</strong><small>La ragione illuminata dalla fede</small></span>
    </a>
    <nav class="top-actions" aria-label="Strumenti rapidi">
      <button class="icon-button" id="searchOpen" aria-label="Cerca in tutto il percorso" title="Cerca">⌕</button>
      <button class="icon-button" id="bookmarkButton" aria-label="Aggiungi questa pagina ai segnalibri" title="Segnalibro">◇</button>
      <button class="icon-button" id="fontButton" aria-label="Ingrandisci il testo" title="Dimensione testo">A</button>
      <button class="icon-button" id="themeButton" aria-label="Cambia tema" title="Tema">◐</button>
      <button class="index-button" id="menuOpen"><span aria-hidden="true">☰</span> Indice</button>
    </nav>
  </header>

  <div class="progress-line" aria-hidden="true"><span id="progressBar"></span></div>
  <nav id="breadcrumbs" class="breadcrumbs" aria-label="Percorso"></nav>
  <main id="view" tabindex="-1"></main>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <button class="drawer-close" id="menuClose" aria-label="Chiudi indice">×</button>
      <p class="eyebrow">Indice generale</p>
      <h2 id="drawerTitle">La cattedrale del pensiero</h2>
      <div id="drawerNav" class="drawer-nav"></div>
      <div class="drawer-footer">
        <button id="installButton" class="button ghost" hidden>Installa la PWA</button>
        <button id="exportButton" class="button ghost">Esporta appunti</button>
        <button id="printButton" class="button ghost">Stampa pulita</button>
      </div>
    </div>
  </aside>

  <dialog id="searchDialog" class="dialog search-dialog">
    <form method="dialog" class="dialog-head"><div><p class="eyebrow">Ricerca globale</p><h2>Cerca nel pensiero</h2></div><button class="dialog-close" aria-label="Chiudi">×</button></form>
    <label class="search-field"><span class="sr-only">Termine da cercare</span><input id="searchInput" type="search" autocomplete="off" placeholder="Esempio: essenza, anima, Averroè…"></label>
    <div id="searchResults" class="search-results" aria-live="polite"></div>
  </dialog>

  <dialog id="infoDialog" class="dialog info-dialog">
    <form method="dialog" class="dialog-head"><div><p id="dialogEyebrow" class="eyebrow"></p><h2 id="dialogTitle"></h2></div><button class="dialog-close" aria-label="Chiudi">×</button></form>
    <div id="dialogBody" class="prose"></div>
  </dialog>

  <section class="study-dock" aria-label="Taccuino di studio">
    <button id="noteToggle" class="dock-button" aria-expanded="false"><span aria-hidden="true">✎</span> Taccuino <span id="noteCount" class="count">0</span></button>
    <div id="notePanel" class="note-panel" hidden>
      <label for="noteText">Nota sulla pagina corrente</label>
      <textarea id="noteText" rows="5" placeholder="Scrivi un pensiero, un dubbio, un collegamento…"></textarea>
      <div class="note-actions"><button id="saveNote" class="button">Salva</button><button id="captureSelection" class="button ghost">Annota la selezione</button></div>
      <p id="noteStatus" class="micro" aria-live="polite"></p>
    </div>
  </section>

  <noscript><div class="noscript">Questa PWA richiede JavaScript per le attività interattive. I contenuti essenziali sono descritti nel README del progetto.</div></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
