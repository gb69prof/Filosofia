<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Lezione completa · Platone & Aristotele</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./full-style.css">
</head>
<body>
<header class="readerTop"><a id="backLink" class="back" href="./">← <span>Studio</span></a><div class="readerTitle"><strong id="topTitle">Lezione completa</strong><small id="topSubtitle">Platone & Aristotele</small></div><div class="readerTools"><button id="fontBtn" aria-label="Cambia dimensione del testo">A</button><button id="printBtn" aria-label="Stampa o salva in PDF">⎙</button></div></header>
<div class="readingProgress"><span id="readingBar"></span></div>
<main id="page" class="page" hidden>
<header class="lessonHero"><p id="who" class="eyebrow"></p><div class="lessonCode" id="code"></div><h1 id="title"></h1><p id="subtitle" class="subtitle"></p><blockquote id="problem" class="problem"></blockquote></header>
<div class="readingLayout"><aside class="tocCard"><p class="tocLabel">In questa lezione</p><nav id="toc"></nav><div class="tocActions"><button id="markRead">Segna come letta</button><a id="previous" href="#">← Precedente</a><a id="next" href="#">Successiva →</a></div></aside><article id="article" class="article"></article></div>
<section class="closing"><div><p class="eyebrow">Sintesi conclusiva</p><h2>Ciò che deve restare</h2><ul id="summary"></ul></div><div class="questions"><h3>Domande per ripensare la lezione</h3><ol id="questions"></ol></div></section>
</main>
<section id="notFound" class="notFound" hidden><p class="eyebrow">Lezione non trovata</p><h1>Il percorso indicato non esiste.</h1><a href="./">Torna a Studio</a></section>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="./full-lessons-platone.js"></script>
<script src="./full-lessons-aristotele.js"></script>
<script src="./full-app.js"></script>
</body>
</html>
