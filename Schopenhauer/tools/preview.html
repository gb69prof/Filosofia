<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifica delle larghezze · Schopenhauer</title><style>body{font-family:system-ui;margin:1rem;color:#26352f;background:#f7f3eb}label,select,button{font:inherit;margin:.4rem;min-height:44px}iframe{display:block;height:850px;border:1px solid #9aa69b;background:white}.viewport{overflow:auto;max-width:100%;border:1px solid #ccc}a{color:#264c43}pre{white-space:pre-wrap}</style>  <link rel="stylesheet" href="../../pwa-common/gbprof-accessibility.css?v=1">
</head><body><h1>Verifica delle larghezze</h1><p>Pagina tecnica per controllare il reflow con finestre CSS di diversa larghezza. Non simula l’hardware o Safari di un iPad.</p><label for="width">Larghezza</label><select id="width"><option value="390">Smartphone · 390 px</option><option value="768">Tablet · 768 px</option><option value="1366">Desktop · 1366 px</option></select><label for="page">Pagina</label><select id="page"><option value="index.html">Ingresso</option><option value="rappresentazione.html">Lezione e mappa</option><option value="salvezza.html">Confronto letterario</option><option value="verifica.html">Verifica</option></select><button id="check">Misura il reflow</button><p id="result" role="status"></p><div class="viewport"><iframe title="Anteprima alla larghezza scelta" width="390" src="../index.html"></iframe></div><p><a href="../index.html">Apri il percorso</a></p><script>const frame=document.querySelector('iframe');document.getElementById('width').onchange=e=>{frame.width=e.target.value};document.getElementById('page').onchange=e=>{frame.src='../'+e.target.value};document.getElementById('check').onclick=()=>{const doc=frame.contentDocument;document.getElementById('result').textContent='Viewport: '+frame.contentWindow.innerWidth+' px; pagina: '+doc.documentElement.scrollWidth+' px; immagini caricate: '+[...doc.images].filter(i=>i.complete&&i.naturalWidth>0).length+'/'+doc.images.length+'. '+(doc.documentElement.scrollWidth<=frame.contentWindow.innerWidth?'Nessun overflow della pagina.':'Overflow della pagina da verificare.');};</script>  <script src="../../pwa-common/gbprof-accessibility.js?v=1"></script>
</body></html>
