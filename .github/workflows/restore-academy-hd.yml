name: Restore Academy HD assets

on:
  push:
    paths:
      - '.github/workflows/restore-academy-hd.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract original WebP images
        shell: python
        run: |
          import base64
          import pathlib
          import re

          assets = pathlib.Path('Platone-Aristotele/visita-accademia/assets')
          pairs = [
              ('mappa-generale.svg', 'mappa-generale.webp'),
              ('platone-1-giardino-socrate.svg', 'platone-1-giardino-socrate.webp'),
          ]
          for source_name, target_name in pairs:
              source = (assets / source_name).read_text(encoding='utf-8')
              match = re.search(r'data:image/webp;base64,([^\"]+)', source)
              if not match:
                  raise RuntimeError(f'WebP incorporato non trovato in {source_name}')
              data = base64.b64decode(match.group(1))
              if not (data.startswith(b'RIFF') and data[8:12] == b'WEBP'):
                  raise RuntimeError(f'Dati WebP non validi in {source_name}')
              (assets / target_name).write_bytes(data)
              print(target_name, len(data), 'bytes')
      - name: Commit final assets and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Platone-Aristotele/visita-accademia/assets/*.webp
          git rm .github/workflows/restore-academy-hd.yml
          git commit -m "Restore full-resolution Academy artwork"
          git push
