<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071721"><meta name="description" content="Dizionario essenziale del lessico socratico."><title>Dizionario · Socrate</title><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../assets/icon.svg"><link rel="stylesheet" href="../shared.css"><style>
.search{width:100%;min-height:3.2rem;padding:.8rem 1rem;border:1px solid var(--line);border-radius:999px;color:var(--paper);background:#0004}.letters{display:flex;flex-wrap:wrap;gap:.45rem;margin:1rem 0}.letters button{width:2.5rem;aspect-ratio:1;border:1px solid var(--line);border-radius:50%;color:var(--gold2);background:#0003}.entry h2{margin:.2rem 0;color:var(--gold2);font:500 2rem var(--serif)}.entry p{color:#f5ecd8ae}.empty{display:none;text-align:center;padding:3rem;color:#f5ecd878}
</style></head><body><header class="top"><a class="home" href="../" aria-label="Torna alla copertina">←</a><div class="topcopy"><strong>Dizionario</strong><small>Parole da non ridurre a slogan</small></div><div class="toptools"><button data-font aria-label="Cambia dimensione testo">A</button></div></header><main><section class="hero compact"><div class="wrap"><p class="eyebrow">Strumento · Lessico</p><h1>Una parola greca non è una decorazione.</h1><p class="lead">Cerca un termine. Ogni definizione è breve, ma segnala le traduzioni che rischiano di renderlo troppo moderno.</p></div></section><section class="section"><div class="wrap"><label class="sr-only" for="search">Cerca nel dizionario</label><input id="search" class="search" type="search" placeholder="Cerca: aporia, psyché, élenchos…" autocomplete="off"><div id="letters" class="letters"></div><div id="entries" class="grid two"></div><p id="empty" class="empty">Nessuna voce corrisponde alla ricerca.</p></div></section></main><footer class="footer">Dizionario · Socrate ad Atene</footer><div id="toast" class="toast" role="status" aria-live="polite"></div><script src="../data.js"></script><script src="../common.js"></script><script>
const words=SOCRATE_DATA.glossary,entries=document.querySelector('#entries'),search=document.querySelector('#search'),letters=document.querySelector('#letters');const initials=[...new Set(words.map(w=>w[0][0].toUpperCase()))];letters.innerHTML='<button data-letter="">Tutte</button>'+initials.map(x=>`<button data-letter="${x}">${x}</button>`).join('');function render(q=''){q=q.toLocaleLowerCase('it');const list=words.filter(w=>w.join(' ').toLocaleLowerCase('it').includes(q));entries.innerHTML=list.map(w=>`<article class="card entry"><span class="tag">Lessico</span><h2>${w[0]}</h2><p>${w[1]}</p></article>`).join('');document.querySelector('#empty').style.display=list.length?'none':'block'}search.addEventListener('input',()=>render(search.value));letters.addEventListener('click',e=>{const b=e.target.closest('[data-letter]');if(!b)return;search.value=b.dataset.letter;render(search.value)});render();
</script></body></html>
