<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071721"><meta name="description" content="Confronti critici su Socrate, sofisti, fonti e politica."><title>Confronti · Socrate</title><link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../assets/icon.svg"><link rel="stylesheet" href="../shared.css"><style>
.compare-select{display:flex;gap:.6rem;overflow:auto;margin:1rem 0}.compare-select button{flex:0 0 auto;padding:.7rem 1rem;border:1px solid var(--line);border-radius:999px;color:var(--paper);background:#0003}.compare-select button.active{color:#071721;background:var(--gold2);font-weight:800}.compare-title{margin:1rem 0;font:500 clamp(2.3rem,6vw,4.5rem)/1 var(--serif)}.compare-columns{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.side-card{min-height:230px}.side-card h3{font-size:1.8rem}.common{grid-column:1/-1;border-color:var(--blue)}.row-table{width:100%;border-collapse:collapse}.row-table th,.row-table td{padding:.9rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.row-table th{width:180px;color:var(--gold2)}
@media(max-width:700px){.compare-columns{grid-template-columns:1fr}.common{grid-column:auto}.row-table th,.row-table td{display:block;width:auto}.row-table th{padding-bottom:.2rem}.row-table td{padding-top:.2rem}}
</style></head><body><header class="top"><a class="home" href="../" aria-label="Torna alla copertina">←</a><div class="topcopy"><strong>Confronti</strong><small>Differenze senza caricature</small></div><div class="toptools"><button data-font aria-label="Cambia dimensione testo">A</button></div></header><main><section class="hero compact"><div class="wrap"><p class="eyebrow">Strumento · Comparazione</p><h1>Le opposizioni semplici sono facili. Quasi sempre sono false.</h1><p class="lead">Cambia confronto e osserva non soltanto le differenze, ma le questioni condivise e il limite di ogni schema.</p></div></section><section class="section"><div class="wrap"><div id="selector" class="compare-select"></div><p id="compareEye" class="eyebrow"></p><h2 id="compareTitle" class="compare-title"></h2><div id="compareView"></div></div></section></main><footer class="footer">Confronti · Socrate ad Atene</footer><div id="toast" class="toast" role="status" aria-live="polite"></div><script src="../common.js"></script><script>
const comparisons=[{key:'sofisti',name:'Socrate / sofisti',eye:'Educazione e verità',title:'Non “buono contro cattivi”, ma pratiche diverse dentro la stessa polis',type:'table',rows:[['Spazio comune','Atene democratica, paideia, linguaggio, areté, vita pubblica.'],['Insegnamento','Socrate nega un sapere professionale da trasmettere; molti sofisti offrono formazione dichiarata.'],['Pagamento','Socrate insiste sulla gratuità; il compenso caratterizza la professione sofistica, con forme e cifre diverse.'],['Forma','Domanda-risposta e confutazione sono tipiche di Socrate; anche i sofisti però usano discorsi brevi e dialogo, e Platone attribuisce a Socrate lunghi discorsi.'],['Verità','Socrate cerca definizioni e coerenza; non tutti i sofisti sostengono lo stesso relativismo, né sono semplicemente indifferenti alla verità.'],['Limite dello schema','Gran parte dell’opposizione ci arriva da Platone, che è parte in causa.']]},{key:'fonti',name:'Le quattro fonti',eye:'Questione socratica',title:'Ogni ritratto vede qualcosa e costruisce qualcos’altro',type:'cards',cards:[['Aristofane','Contemporaneo e comico','Percezione pubblica; dottrina caricaturale.'],['Senofonte','Discepolo e apologeta','Pratica morale; normalizzazione difensiva.'],['Platone','Discepolo e filosofo','Massima profondità; massima trasformazione filosofica.'],['Aristotele','Ricostruttore successivo','Distinzioni concettuali; filtro sistematico e indiretto.']]},{key:'regimi',name:'Democrazia / Trenta',eye:'Socrate e la politica',title:'La stessa coerenza contro due abusi opposti',type:'cards',cards:[['Democrazia, 406 a.C.','Processo degli strateghi','Socrate rifiuta una procedura collettiva considerata illegale.'],['Trenta, 404/403 a.C.','Leone di Salamina','Socrate rifiuta di collaborare a un arresto ingiusto.'],['Nucleo comune','Non fare ingiustizia','La legittimità del regime non sostituisce l’esame dell’azione.'],['Problema aperto','Critica della democrazia','Non basta per definirlo democratico o oligarchico.']]},{key:'storico',name:'Storico / platonico',eye:'Attribuzione',title:'Quando dici “Socrate pensa”, quale Socrate stai usando?',type:'table',rows:[['Relativamente solido','Vita pubblica, processo nel 399, assenza di scritti, attività interrogativa, servizio militare.'],['Plausibile','Centralità dell’esame etico, professione d’ignoranza, cura della psyché.'],['Soprattutto platonico','Teoria sviluppata dell’immortalità nel Fedone, Idee, reminiscenza, architetture metafisiche.'],['Caso limite','Maieutica del Teeteto: immagine celebre ma tardi sviluppata da Platone.'],['Regola','Nomina sempre la fonte: “Platone attribuisce…”, “Secondo Senofonte…”.']]},{key:'apologia-critone',name:'Apologia / Critone',eye:'Legge e coscienza',title:'Disobbedire a un ordine, accettare una condanna',type:'cards',cards:[['Apologia','Non obbedire all’ingiustizia','Socrate rifiuta il comando dei Trenta e sostiene che continuerebbe a filosofare.'],['Critone','Non fuggire','La fuga danneggerebbe le leggi e violerebbe un accordo.'],['Principio comune','Mai commettere ingiustizia','Subire un torto non autorizza a compierne un altro.'],['Tensione interpretativa','Che cosa si deve obbedire?','Alla singola decisione, alla legge, alla ragione o alla giustizia? Il testo resta discusso.']]}];const selector=document.querySelector('#selector'),view=document.querySelector('#compareView');selector.innerHTML=comparisons.map((c,i)=>`<button data-i="${i}">${c.name}</button>`).join('');function show(i){const c=comparisons[i];selector.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('active',j===i));document.querySelector('#compareEye').textContent=c.eye;document.querySelector('#compareTitle').textContent=c.title;if(c.type==='table')view.innerHTML=`<article class="card"><table class="row-table">${c.rows.map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('')}</table></article>`;else view.innerHTML=`<div class="compare-columns">${c.cards.map((x,j)=>`<article class="card side-card ${j===2?'common':''}"><span class="tag ${j===3?'open':'testimony'}">${x[1]}</span><h3>${x[0]}</h3><p>${x[2]}</p></article>`).join('')}</div>`}selector.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)show(Number(b.dataset.i))});show(0);
</script></body></html>
